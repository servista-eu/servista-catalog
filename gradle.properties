# ⛔ IMMUTABLE FROM 0.2.0 ON. Until 2026-09-03 this was a MUTABLE 0.1.0, retagged in place by
# `DELETE`-ing the version through the Forgejo packages API and republishing — so the artifact a
# consumer had been built against stopped existing, and every consumer was forced to move whether or
# not anything it used had changed.
#
# ✅ From 0.2.0 a published version is NEVER deleted and NEVER re-uploaded. Proven of THIS registry
# on 2026-09-03 before the first immutable publish: a second PUT of a published coordinate is
# refused `409 package file already exists` — byte-identical AND with different bytes — with a
# never-published coordinate accepted `201` as the control.
#
# ⚠️ A CATALOG THAT IS ITSELF MUTABLE MAKES EVERY PIN UNDER IT ILLUSORY, which is why this file
# moves in the same change as the two libraries it names.
#
# ⚠️ 0.7.0 -> 0.8.0 on 2026-09-04 by `A432 #608`, and it moves for TWO aliases:
# `servista-kotlin-commons` 0.4.0 -> 0.5.0 and `servista-service-runtime` 0.5.0 -> 0.6.0.
# ⛔ The cause is a BREAKING ABI change that no source diff shows: `ActorContext.actorAccountId`
# became an `AccountId`, and a Kotlin `value class` mangles the accessor name after its TYPE —
# `getActorAccountId-WxZp0KI` became `getActorAccountId-NdfhRDM`. A consumer compiled against
# 0.4.0 and run against 0.5.0 therefore fails `NoSuchMethodError` at the call, not at startup.
# `checkKotlinAbi` is what caught it; the signature stayed `(J)`, so there is still NO boxing.
#
# ⚠️ 0.3.0 -> 0.4.0 on 2026-09-03 by `A417 #592`, and it moves for ONE alias:
# `servista-avro-schemas` 0.2.0 -> 0.3.0. ⛔ THE CATALOG PUBLISHES FIRST, BEFORE THE LIBRARY IT
# NAMES EXISTS — `CLAUDE.md` §3's release order, and it is sound because a catalog DECLARES and
# nothing resolves until a consumer asks. ⛔ AND IT MUST BE RIGHT BEFORE ITS FIRST PUBLISH: an
# immutable catalog with a wrong alias costs a 0.4.1, not an edit.
# ⚠️ 0.10.0 -> 0.11.0 on 2026-09-05 by `F434 #610`, and it moves for ONE alias:
# `servista-service-runtime` 0.7.0 -> 0.8.0. `servista-kotlin-commons` stays at 0.6.0 and
# `servista-avro-schemas` at 0.3.0 — neither changed, and under immutable versions a library is
# allowed not to move.
version=0.11.0
