#
# ⚠️ 0.15.0 -> 0.16.0 on 2026-09-05 by `A383 #561`, and it moved for ONE alias:
# `servista-kotlin-commons` 0.10.0 -> 0.11.0. `servista-service-runtime` stays at 0.8.0 and
