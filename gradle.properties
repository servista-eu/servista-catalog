# allowed not to move.
# ⛔ The bump exists because every Kafka client in the estate was presenting the key material it
# read at boot, for ever: `KafkaSslConfig` held the certificate and key CONTENTS and Kafka's own
# `DefaultSslEngineFactory` caches one `SSLContext` for the life of the client. A renewed
# certificate was therefore invisible to a running process, and a 24 h certificate under a
# multi-day producer is a fault that cannot present until something forces a handshake. Measured
# live the same day on `trino-coordinator-beta` — 30,360 refusals at one broker in 24 h with a
# current certificate on disk beside it.

