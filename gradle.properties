# ⛔ IMMUTABLE FROM 0.2.0 ON. Until 2026-09-03 this was a MUTABLE 0.1.0, retagged in place by
# `DELETE`-ing the version through the Forgejo packages API and republishing — so the artifact a
# consumer had been built against stopped existing, and every consumer was forced to move whether or
# not anything it used had changed.
#
# ✅ From 0.2.0 a published version is NEVER deleted and NEVER re-uploaded. Proven of THIS registry
# on 2026-09-03 before the first immutable publish: a second PUT of a published coordinate is
# refused `409 package file already exists` — byte-identical AND with different bytes — with a
# never-published coordinate accepted `201` as the control.
#
# ⚠️ A CATALOG THAT IS ITSELF MUTABLE MAKES EVERY PIN UNDER IT ILLUSORY, which is why this file
# moves in the same change as the two libraries it names.
#
# ⚠️ 0.7.0 -> 0.8.0 on 2026-09-04 by `A432 #608`, and it moves for TWO aliases:
# `servista-kotlin-commons` 0.4.0 -> 0.5.0 and `servista-service-runtime` 0.5.0 -> 0.6.0.
# ⛔ The cause is a BREAKING ABI change that no source diff shows: `ActorContext.actorAccountId`
# became an `AccountId`, and a Kotlin `value class` mangles the accessor name after its TYPE —
# `getActorAccountId-WxZp0KI` became `getActorAccountId-NdfhRDM`. A consumer compiled against
# 0.4.0 and run against 0.5.0 therefore fails `NoSuchMethodError` at the call, not at startup.
# `checkKotlinAbi` is what caught it; the signature stayed `(J)`, so there is still NO boxing.
#
# ⚠️ 0.3.0 -> 0.4.0 on 2026-09-03 by `A417 #592`, and it moves for ONE alias:
# `servista-avro-schemas` 0.2.0 -> 0.3.0. ⛔ THE CATALOG PUBLISHES FIRST, BEFORE THE LIBRARY IT
# NAMES EXISTS — `CLAUDE.md` §3's release order, and it is sound because a catalog DECLARES and
# nothing resolves until a consumer asks. ⛔ AND IT MUST BE RIGHT BEFORE ITS FIRST PUBLISH: an
# immutable catalog with a wrong alias costs a 0.4.1, not an edit.
# ⚠️ 0.13.0 -> 0.14.0 on 2026-09-05 by `A344 #519` `D6`, for the same ONE alias:
# `servista-kotlin-commons` 0.8.0 -> 0.9.0 — two real defects in the entry-point closure, both
# found by reading its first real output rather than by a test. See that repository's
# `gradle.properties` for what they were.
#
# ⚠️ 0.12.0 -> 0.13.0 on 2026-09-05 by `A344 #519` `D6`, for ONE alias again:
# `servista-kotlin-commons` 0.7.0 -> 0.8.0 — the capability dump gained an ENTRY POINTS column
# without which the estate's checker could not see the row's own two requests, both of which live
# in private helpers. ⛔ A second bump rather than an amended 0.12.0 because versions are
# immutable; that is `DP-1` working.
#
# ⚠️ 0.11.0 -> 0.12.0 on 2026-09-05 by `A344 #519` `D6`, and it moves for ONE alias:
# `servista-kotlin-commons` 0.6.0 -> 0.7.0. `servista-service-runtime` stays at 0.8.0 and
# `servista-avro-schemas` at 0.3.0 — neither changed, and under immutable versions a library is
# allowed not to move.
# ⛔ The bump exists because a type shared between `servista-kotlin-commons` and
# `servista-kotlin-commons-infra` can only travel through this catalog: the infra repository has no
# composite include and resolves commons from the registry. That is the price of putting the
# adapter capability vocabulary in the shared library, re-derived at execution rather than assumed.
#
# ⚠️ 0.10.0 -> 0.11.0 on 2026-09-05 by `F434 #610`, and it moves for ONE alias:
# `servista-service-runtime` 0.7.0 -> 0.8.0. `servista-kotlin-commons` stays at 0.6.0 and
# `servista-avro-schemas` at 0.3.0 — neither changed, and under immutable versions a library is
# allowed not to move.
# ⚠️ 0.14.0 -> 0.15.0 on 2026-09-05 by `F439 #615` (owner decision `D-177`), and it moves for ONE
# alias plus one NEW one: `servista-kotlin-commons` 0.9.0 -> 0.10.0, and
# `servista-commons-rt-lakehouse-foss-trino`, a sixteenth runtime adapter — the Trino JDBC driver's
# own `QueryStats` published through `MetricsPort`, and the `publishProgressTo` extension that
# wires the driver's progress monitor rather than reading `getStats()` after the statement.
# `servista-service-runtime` stays at 0.8.0 and `servista-avro-schemas` at 0.3.0 — neither changed,
# and under immutable versions a library is allowed not to move.
# ⛔ The bump exists because the estate's two Trino JDBC callers live in two repositories and the
# only path between them is this catalog.
#
# ⚠️ 0.16.0 -> 0.17.0 on 2026-09-05 by `A383 #561`, and it moves for ONE alias:
# `servista-kotlin-commons` 0.11.0 -> 0.12.0. ⛔ The reason is a defect in what 0.11.0 SHIPPED,
# found in production in that release's own instrument minutes after it deployed: Kafka builds one
# `SslEngineFactory` per CLIENT and an ordinary service wires three, so a process-global load
# counter reached 3 at boot and `servista-secrets` v0.1.27 announced "SSL material reloaded without
# a restart" TWICE, having reloaded nothing. `LoadedMaterial` now carries `reloadCount` — times the
# material on disk actually changed under a live factory — and the message is driven off the one
# bit only the factory knows. ⭐ Caught before the fleet rebuilt, so it cost one extra image.
#
# ⚠️ 0.15.0 -> 0.16.0 on 2026-09-05 by `A383 #561`, and it moved for ONE alias:
# `servista-kotlin-commons` 0.10.0 -> 0.11.0. `servista-service-runtime` stays at 0.8.0 and
# `servista-avro-schemas` at 0.3.0 — neither changed, and under immutable versions a library is
# allowed not to move.
# ⛔ The bump exists because every Kafka client in the estate was presenting the key material it
# read at boot, for ever: `KafkaSslConfig` held the certificate and key CONTENTS and Kafka's own
# `DefaultSslEngineFactory` caches one `SSLContext` for the life of the client. A renewed
# certificate was therefore invisible to a running process, and a 24 h certificate under a
# multi-day producer is a fault that cannot present until something forces a handshake. Measured
# live the same day on `trino-coordinator-beta` — 30,360 refusals at one broker in 24 h with a
# current certificate on disk beside it.

# ⚠️ 0.17.0 -> 0.18.0 on 2026-09-06 by `A377 #553`, and it moves for ONE alias:
# `servista-service-runtime` 0.8.0 -> 0.9.0. `MeteredHealthCheck`'s `health.check.status` was
# seeded `HealthStatus.UP` and published `1.0` -- healthy -- about a dependency nothing had asked
# about. ⛔ A BEHAVIOUR change with NO ABI change, so `checkKotlinAbi` says nothing about it and
# `rebuild-set.mjs` is what names the consumers that must move.
# ⚠️ 0.18.0 -> 0.19.0 on 2026-09-06 by `A392 #451`, and it moves for TWO aliases:
# `servista-kotlin-commons` 0.12.0 -> 0.13.0 and `servista-service-runtime` 0.9.0 -> 0.10.0. ⛔ An
# ABI change in `AuthorizationPort.checkAccess`, which is the call `PermissionGuard` makes on every
# authorization decision -- so unlike the last three catalog bumps this one obliges a rebuild rather
# than only a re-pin, and `rebuild-set.mjs` names which images.
# ⚠️ 0.19.0 -> 0.20.0 on 2026-09-06 by `F454 #630`, and it moves for ONE ref that is NOT a
# `eu.servista` library: `apicurio-avro-serde` 3.3.1 -> 3.3.2. ⛔ NO LIBRARY MOVES, so
# `rebuild-set.mjs` names nothing and no image is obliged — this bump is a RE-PIN and not a
# rebuild, which is a distinction `CLAUDE.md` §3's four-step recipe deliberately keeps: pin
# always, rebuild only when `rebuild-set` names you.
# ⛔⛔ THE CAUSE OF THIS RELEASE IS A CONTAINER IMAGE TAG IN ANOTHER REPOSITORY. `A448 #624`
# moved `apicurio/apicurio-registry` 3.3.1 -> 3.3.2 in `mspcloud`, and `apicurio-avro-serde`
# is a `tracksServer` ref whose target `check-dependency-currency.mjs` reads off the RUNNING
# cluster — so that edit moved this catalog's ref from `current-for-server` to `behind-server`
# in the same instant, with nothing at the point of the act saying so. `D-189` records the
# mispriced cost clause; `check-tracked-server-images.mjs` is the program that now announces
# the obligation at the manifest that sets the tag.
# ⚠️ Nothing was broken and nothing is fixed by the NUMBER: the ref is inert (zero declaration
# sites, measured with a passing control). What is repaired is a red armed gate and a
# declaration that had stopped being true.
# ⚠️ 0.20.0 -> 0.21.0 on 2026-09-06 by `A455 #631` (owner decision `D-191`), and it moves for ONE
# alias: `servista-kotlin-commons` 0.13.0 -> 0.14.0. `servista-service-runtime` stays at 0.10.0 and
# `servista-avro-schemas` at 0.3.0 — neither changed, and under immutable versions a library is
# allowed not to move.
# ⛔ ABI: BREAKING. `RelationshipPort` gains a fifth read, `readObjects(subject, relation, type)` —
# a `Read` rather than a Check-expansion — so every implementation must grow it. `checkKotlinAbi`
# refused the first run and named it on both `commons-core` and `commons-rt-authz-foss-openfga`,
# unprompted. Six test doubles in three service repositories grow the method with this re-pin.
# ⛔ The bump exists because `listObjects` EVALUATES conditions: a `time_bound_access` grant past
# its `valid_until` is silently absent from it, so a reconciler computing `missing = database -
# listObjects(...)` rewrote the tuple UNCONDITIONED and un-expired the grant. None of the four
# existing read shapes could answer *"which objects does this subject hold a STORED tuple for"*.
# ⚠️ 0.21.0 -> 0.22.0 on 2026-09-07 by `A297 #461` (ADR-034's authority half), and it moves for ONE
# alias: `servista-service-runtime` 0.10.0 -> 0.11.0. `servista-kotlin-commons` stays at 0.14.0 and
# `servista-avro-schemas` at 0.3.0 -- neither changed, and under immutable versions a library is
# allowed not to move.
# ⛔ ABI: ADDITIVE. `AuthSource` gains a second member and therefore a second getter; a consumer
# compiled against 0.10.0 still links. What moves is BEHAVIOUR -- an `AuthSource.MTLS` principal no
# longer skips `requirePermission` and no longer receives the RLS platform bypass on its source --
# so `checkKotlinAbi` says nothing about it and `node tools/rebuild-set.mjs` names the images.
# ⚠️ Inert until something turns mTLS on: `MTLS_ENABLED` is set in exactly ONE place estate-wide
# and is "false" (measured 2026-09-07, control: `AUTH_ENABLED` set in 17 of 17).

# ⚠️ 0.22.0 -> 0.23.0 on 2026-09-07 by `A297 #461` `D5`, and it moves for ONE alias plus one NEW
# one: `servista-service-runtime` 0.11.0 -> 0.12.0, and `ktor-network-tls`, which
# `servista-service-runtime` now compiles against for `addCertificateChain`. `servista-kotlin-commons`
# stays at 0.14.0 and `servista-avro-schemas` at 0.3.0.
# ⛔ A SECOND CATALOG RELEASE IN ONE SITTING, AND THAT IS IMMUTABILITY WORKING RATHER THAN A MISTAKE.
# 0.22.0 is published and can never be amended, so a coordinate discovered after it — here, an
# engine module whose extension function is not on an `implementation` dependency's compile
# classpath — costs a version rather than an edit. `DP-1`'s arm (a) priced exactly this.

# ⚠️ 0.23.0 -> 0.24.0 on 2026-09-07 by `A297 #461` `D5`: `servista-service-runtime` 0.12.0 -> 0.13.0.
# The third catalog release of this sitting, and each one is a thing the previous could not have
# known: `D4`'s authority half, then the client half's compile classpath, then a guard defect that
# only a real edge could surface. ⭐ That is `DP-1`'s arm (a) doing its job — under the mutable
# `0.1.0` this would have been three retags of one coordinate and no record of which was which.
# ⚠️ 0.24.0 -> 0.25.0 on 2026-09-07 by `A297 #461`: `servista-service-runtime` 0.13.0 -> 0.14.0, a
# one-function repair to a guard that production found within minutes of its first rollout.
# ⚠️ 0.25.0 -> 0.26.0 on 2026-09-07 by `F289 #453`: `servista-service-runtime` 0.14.0 -> 0.15.0,
# publishing the authorization model's vocabulary as `AuthorizationModel`.
# ⚠️ 0.26.0 -> 0.27.0 on 2026-09-08 by `A472 #648` `D2` (owner decision, 2026-09-08), and it moves
# for ONE alias plus one NEW one: `servista-service-runtime` 0.15.0 -> 0.16.0, and
# `ktor-client-java` — the HTTP client engine this estate's outbound traffic now runs on.
# `servista-kotlin-commons` stays at 0.14.0 and `servista-avro-schemas` at 0.3.0; neither changed,
# and under immutable versions a library is allowed not to move.
# ⛔ THE CAUSE IS A TLS DEFECT NO INSTRUMENT IN THIS ESTATE COULD SEE. `ktor-client-cio` ships its
# own TLS implementation whose client-certificate selection has no EC branch and whose
# `CertificateType` vocabulary has no `ecdsa_sign(64)`, so every EC P-256 `pki-s2s` identity was
# filtered out and an EMPTY certificate list was sent. Seven converted mTLS edges carried ZERO
# application requests for eight hours while `curl` (OpenSSL), the dependency preflight (a plain
# TCP connect) and a JSSE unit test all reported them healthy. `ktor-client-java` wraps
# `java.net.http.HttpClient`, so outbound TLS is the same JSSE the listener is opened with.
# ⛔ ADDITIVE ABI, BEHAVIOURAL CHANGE — `checkKotlinAbi` says NOTHING about it, which is the
# `A377 #553` shape, so `node tools/rebuild-set.mjs` names the images rather than the dumps.
# ⚠️ AND THE ALIAS COSTS A CATALOG VERSION RATHER THAN AN EDIT, which is `DP-1` working: the fix
# was proven green on a branch carrying a LITERAL `io.ktor:ktor-client-java:3.5.2`, deliberately,
# because an immutable catalog with a wrong alias costs a 0.27.1.
# ⛔⛔ 0.27.0 -> 0.28.0 on 2026-09-08 by `A472 #648` `D2`, AND IT EXISTS BECAUSE 0.27.0 WAS WRONG.
# 0.27.0 added the `ktor-client-java` alias and left `servista-service-runtime` at 0.15.0, so it
# named the engine and not the release that uses it. Under `DP-1` a published version is never
# amended, so the repair is a version — which is exactly the price the release order's "IT MUST BE
# RIGHT BEFORE ITS FIRST PUBLISH" is warning about, paid.
# ⚠️ 0.27.0 IS NOT WITHDRAWN AND CANNOT BE: it is published, immutable, and a valid catalog — it
# simply declares one alias more than 0.26.0 and nothing else. Nothing pins it after this release.
# ⭐ THE GENERALISABLE HALF, and it is about the CHECK rather than the slip: the pre-publish
# verification diffed the catalog's ENTRY SET and reported "1 added, 0 removed, 0 changed" — and
# read `0 changed` as a pass, when for a release that exists to move a library version it was the
# finding. `node tools/check-catalog-pins.mjs` was green throughout, because it asserts that
# consumers pin the CURRENT CATALOG and never that the catalog's own refs name each library's
# CURRENT VERSION. That gap is closed in the same sitting.
# ⚠️ 0.28.0 -> 0.29.0 on 2026-09-08 by `F477 #653`, and it moves for ONE alias:
# `servista-kotlin-commons` 0.14.0 -> 0.15.0. `servista-service-runtime` stays at 0.16.0 and
# `servista-avro-schemas` at 0.3.0 — neither changed, and under immutable versions a library is
# allowed not to move. NO alias is added or removed; the entry set is unchanged.
# ⛔ THE CAUSE IS A DEPENDENCY THAT WAS INVISIBLE FROM ITS OWN MODULE'S SOURCE.
# `commons-rt-http-foss-ktor` declared `implementation(libs.ktor.client.cio)` while never
# constructing a client — `KtorHttpClientAdapter` wraps an injected `HttpClient` — so the engine
# bought the adapter nothing and put a SECOND HTTP client engine on the production runtime classpath
# of every service in the estate. Measured off the published POMs:
# `commons-rt-http-foss-ktor:0.14.0` -> `io.ktor:ktor-client-cio-jvm:3.5.2` at `runtime`, reaching
# `runtimeClasspath` through `commons-wiring-koin-rt-http-foss-ktor:0.14.0`, beside
# `servista-service-runtime-core:0.16.0` -> `io.ktor:ktor-client-java-jvm:3.5.2`. The 0.15.0 POM
# reads 6 dependencies where 0.14.0 read 7 and the engine line is gone.
# ⛔ Two engines on one classpath make a bare `HttpClient()` a coin flip decided by ServiceLoader
# order, and WHICH ENGINE GOT PICKED is the whole of `A472 #648` — seven converted mTLS edges
# carrying zero application requests for eight hours while three instruments called them healthy.
# ⚠️ NO ABI MOVES and no source behaviour changes: this release removes a DEPENDENCY, which is the
# `A377 #553` shape read from a third direction — `checkKotlinAbi` says nothing about it and
# `node tools/rebuild-set.mjs` names the images.
# ⭐ THE 0.27.0 DEFECT WAS NOT REPEATED, AND IT WAS CHECKED RATHER THAN REMEMBERED. 0.27.0 added an
# alias and left the library ref forty lines away untouched; this release moves the ref and adds no
# alias, and `node tools/check-catalog-pins.mjs`'s FOURTH assertion — every `eu.servista` version ref
# names the version its own repository publishes — was run against this file BEFORE the publish, with
# the library already published so the ref names a version that demonstrably exists.
