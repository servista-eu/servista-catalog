# `SslEngineFactory` per CLIENT and an ordinary service wires three, so a process-global load
# counter reached 3 at boot and `servista-secrets` v0.1.27 announced "SSL material reloaded without
# a restart" TWICE, having reloaded nothing. `LoadedMaterial` now carries `reloadCount` — times the
# material on disk actually changed under a live factory — and the message is driven off the one
