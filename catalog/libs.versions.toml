# ⛔ DECLARED, NOT INHERITED — D-50, 2026-08-23. At aws-sdk 2.46.0 the SDK replaced the
# default `apache-client` with `apache5-client`, so a synchronous S3Client that configures
# no HTTP client silently changed which one it uses (and `Expect: 100-Continue` from on to
