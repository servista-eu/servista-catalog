# servista Service Runtime
#
# ⛔ THE AGGREGATE `servista-service-runtime` ALIAS IS GONE AT 0.2.0, DELIBERATELY. Until 0.1.0 this
# was ONE artifact that every service took and that declared every infrastructure adapter
# unconditionally — jOOQ, Kafka, the AWS SDK, Lettuce, OpenBao and a block-storage adapter with no
# consumer at all — so 70% of a real service's runtime classpath and ≈444 MB across the fleet was
# code no service loads (`work/shared-libraries/01-ANALYSIS.md` §3).
#
# ⚠️ The coordinate `eu.servista:servista-service-runtime:0.1.0` still RESOLVES and always will —
# nothing is deleted under the immutable scheme. It simply has no 0.2.0. A repository that has not
# moved keeps building against 0.1.0; one that moves takes `-core` plus the slices it uses, and the
# compiler is the census.
servista-service-runtime-core = { module = "eu.servista:servista-service-runtime-core", version.ref = "servista-service-runtime" }
servista-service-runtime-database = { module = "eu.servista:servista-service-runtime-database", version.ref = "servista-service-runtime" }
# ⛔ THE KAFKA DISPATCHER SLICE IS `-messaging`, NOT `-events`. `servista-service-runtime-events` is
# a DIFFERENT, PRE-EXISTING artifact (the Avro envelope codec and the event-consumer bootstrap) that
# 15 services already declare. Naming the dispatcher slice `-events` would collide with it.
servista-service-runtime-messaging = { module = "eu.servista:servista-service-runtime-messaging", version.ref = "servista-service-runtime" }
servista-service-runtime-authorization = { module = "eu.servista:servista-service-runtime-authorization", version.ref = "servista-service-runtime" }
servista-service-runtime-cache = { module = "eu.servista:servista-service-runtime-cache", version.ref = "servista-service-runtime" }
servista-service-runtime-objectstorage = { module = "eu.servista:servista-service-runtime-objectstorage", version.ref = "servista-service-runtime" }
servista-service-runtime-secrets = { module = "eu.servista:servista-service-runtime-secrets", version.ref = "servista-service-runtime" }
servista-service-runtime-saga = { module = "eu.servista:servista-service-runtime-saga", version.ref = "servista-service-runtime" }
servista-service-runtime-idempotency = { module = "eu.servista:servista-service-runtime-idempotency", version.ref = "servista-service-runtime" }
