# Published version catalog for servista-based projects.
# Consumers import via: from("eu.servista:servista-catalog:<version>")

[versions]
kotlin = "2.4.10"
ktor = "3.5.2"
koin = "4.2.2"
jooq = "3.21.7"
# ⛔ CLASS II, AND ITS SERVER IS A HARD BOUND RATHER THAN A LOOSE ONE. jOOQ's Open Source Edition
# supports exactly ONE PostgreSQL major per minor — the vendor's own legend is "The jOOQ Open
# Source Edition always supports the latest dialect version", which makes the support matrix's
# "Minimum version (OSS edition)" column simultaneously the MAXIMUM. So 3.20 -> PostgreSQL 17 and
# 3.21 -> 18, and PostgreSQL 18 appears in NO edition of 3.20.
# ⛔⛔ Production has run PostgreSQL 18 since 2026-04-27. This ref sat at 3.20.11 from the catalog's
# first commit (2026-03-23) until 2026-08-25 — 120 days OUTSIDE the vendor's support window for the
# server it dials, with no signal anywhere, because nothing on the CLIENT side moved.
# ✅ `node tools/check-server-floor.mjs` in servista-planning is what now says so: it reads the
# server major FROM THE CLUSTER and refuses on a jOOQ minor its table has never seen.
# Moved by W1-JQ (D-94, 2026-08-25). ⚠️ Nine aliases share this ref and five have no consumer;
# they are KEPT because the intersection rule verifies all nine at every bump and re-adding one
# later is a line, while an unverified coordinate is a silent hole.
flyway = "13.4.0"
hikari = "7.1.0"
postgresql-jdbc = "42.7.13"
oracle-jdbc = "23.26.3.0.0"
# Trino JDBC — the client for the Iceberg lakehouse, on BOTH sides of the audit trail: the
# audit writer (Phase 8 WP5) and the audit query API (WP6). ADR-028 settles it as the driver
# rather than a hand-rolled REST client, because halt-not-degrade is exactly the property a
# hand-written protocol client gets subtly wrong. ⚠️ The coordinators run 480 and this is 483:
# a driver ahead of the server is the normal upgrade order for Trino, and 483 is what the ADR
# measured — 10.44 MB against 480's 13.10 MB, well inside the image's margin under the edge cap.
trino-jdbc = "483"
kafka = "4.3.1"                     # Kafka clients (produce/consume)
flink = "2.3.0"                     # latest stable (verified 2026-05); Silver streaming engine (ADR-019)
# ⛔ THE `-2.x` SUFFIX IS A RELEASE LABEL, NOT A COMPILE TARGET. This line read
#    `4.0.1-2.0 # latest; built for Flink 2.0, API-compatible with 2.x — verify on 2.2` until
#    2026-08-25, and every clause of that was false or unverifiable. Measured (`W1-CJ`'s successor
#    `W1-FK`, `D-92`): `flink-connector-kafka-parent` declares `flink.version 2.1.0` at BOTH
#    `5.0.0-2.1` and `5.0.0-2.2`; the two parent POMs differ by one line, the `<version>` element;
#    and the two jars have identical entry lists with **0 of 211 class files differing** (only
#    `MANIFEST.MF`). ⭐ They are the SAME ARTIFACT. Control: `4.0.1-2.0 → 5.0.0-2.2` moves 125 of 185.
# ⚠️ So this connector is built against Flink **2.1.0** while `flink` above is `2.3.0` — a two-minor
#    gap that the bump NARROWS (from three) and nothing closes: there is no `-2.3` build, ever.
# ⛔ AND IT IS CLASS II, NOT CLASS I: `org.apache.kafka:kafka-clients` is a COMPILE-scope,
#    non-optional, transitive dependency, so this is a client of the deployed Strimzi broker. The
#    bump takes that bundled client `3.9.1 → 4.2.0`, which is EXACTLY the broker's version.
# ⚠️ LATENT CONFLICT for the first pipeline module that ever exists: `kafka` below is `4.3.1`, the
#    broker runs `4.2.0`, and this connector is built against `4.2.0` — a module naming both refs
#    resolves `kafka-clients` to `4.3.1` by Gradle's highest-wins, one minor ahead of what this was
#    tested with. No gate anywhere says so, because there is no consumer yet.
flink-connector-kafka = "5.0.0-2.2"
avro = "1.12.2"
# W3-AP (F269 #426): governance/servista-planning/work/upgrades/components/W3-AP-apicurio-strimzi-kafka.md
# ⛔ THE COORDINATE MOVED AND THE OLD ONE IS DEAD. `io.apicurio:apicurio-registry-serdes-avro-serde`
# was renamed to `io.apicurio:apicurio-registry-avro-serde-kafka` at 3.0.0.M5 — the release
# immediately after the 3.0.0.M4 this ref used to pin, so M4 is not "an old milestone", it is the
# LAST ARTIFACT EVER PUBLISHED under that name (maven-metadata lastUpdated 2025-07-16).
# ⚠️ That is why check-dependency-currency.mjs reported this ref as `current-preview` against a
# "latest" of 2.6.13.Final: the tool reads the metadata of the coordinate it is given, and that
# coordinate's own metadata says its latest is M4. The tool was right; the coordinate was dead.
# ⛔ A CURRENCY CHECK KEYED ON A COORDINATE CANNOT SEE A RENAME — F269 #426 D5 owns that gap.
# ✅ The new line tracks the SERVER's version exactly (registry 3.3.1 ⇒ serde 3.3.1), which is a
# strictly better place to be than a milestone that can never move again.
# ⚠️ NOTHING CONSUMES THIS REF — measured 2026-08-22 with a passing control, zero declaration sites.
# Servista speaks the registry's v3 REST API through its own SchemaRegistryClient in
# commons-rt-events-foss-kafka-avro, which exists for a reason the vendor serde does not give for
# free: it resolves the global id by the RECORD'S OWN schema rather than by the artifact's `latest`,
# which is what A37 #153 cost 29 unreadable records. ⛔ Repointed rather than DELETED (owner
# decision D-38, 2026-08-22): deleting it would assert a decision never taken — that this estate
# will not use a vendor serde — and "nothing calls it" is not an argument about design.
# ⛔ THE REF IS RENAMED TOO, and that is not cosmetic: the old artifact was `…-serdes-avro-serde`
# (plural) and the new one is `…-avro-serde-kafka` (singular), so a ref still called
# `apicurio-serdes` names the DEAD coordinate's vocabulary — and the ref name is the key both
# `check-dependency-currency.mjs` and `check-doc-version-tables.mjs` are wired on, which is part of
# why the rename stayed invisible for a year. Same disposition as W2e's `junit5` → `junit`.
apicurio-avro-serde = "3.3.1"
# W3-OF (F269 #426): governance/servista-planning/work/upgrades/components/W3-OF-openfga.md
# ⛔ 0.9.8 is a PRERELEASE and 0.9.10 never reached the registry (upstream says so), so the interval
# is 0.9.7 -> 0.9.11 and there is nothing in between to read. ⭐ The bump is also A277 #434's fix:
# 0.9.11 imports jackson-bom 2.22.1 (0 advisories) where 0.9.7 imported 2.21.1 (10), and it promotes
# jackson-core/-annotations/-databind, jsr305 and opentelemetry-api from `runtime` to `compile` in
# its published POM — measured by diffing the two POMs, not read from a release note. That promotion
# is what retired the `jackson2` ref this file used to carry; see the deletion note below.
# ⚠️ It also moves opentelemetry-bom 1.59.0 -> 1.64.0. ✅ That INVERSION IS RESOLVED as of
# 2026-08-25: `D-86` took `otel` to `1.65.0`, which is above it. Kept because the shape recurs —
# a transitive BOM can sit above a catalog ref and nothing in the build says so.
openfga = "0.9.11"
lettuce = "7.7.0.RELEASE"
netty = "4.2.17.Final"
nimbus-jose-jwt = "10.9.1"
# W3-O11Y act 2 (F310 #476), decision `D-86`, 2026-08-25: `1.61.0` -> `1.65.0`, four releases read.
# ⛔ The interval carries TEN `**BREAKING**` entries and every one of them was grepped against the
# tree and reaches ZERO files (controls: a fabricated symbol 0, `libs.otel.sdk` 23). The one worth
# knowing about is `1.62.0`'s Prometheus exporter default host moving `0.0.0.0` -> `localhost`: that
# is `F310`'s own defect class — a healthy pod the store cannot reach — and it misses us only
# because we do not use `opentelemetry-exporter-prometheus` at all.
# ⚠️ `CVE-2026-45292` / `GHSA-rcgg-9c38-7xpx` (CVSS 5.3, unbounded allocation parsing W3C baggage)
# names `io.opentelemetry:opentelemetry-api <= 1.61.0` — this ref's previous value exactly — and is
# first patched at `1.62.0`. ⛔ It does NOT reach our configuration and the bump must not be quoted
# as remediation: `OtelSetup.kt` registers `W3CTraceContextPropagator` alone, we declare
# `opentelemetry-extension-trace-propagators` on zero classpaths, and nothing in our source calls
# `.extract(` — the vulnerability is in the parser and we only ever inject. A scanner keyed to the
# coordinate will still flag the old pin, correctly.
# ⭐ Free with the bump and worth knowing: `1.65.0` fixes `OkHttpHttpSender` mTLS against the
# platform default trust store (ADR-034 / A297 #461's path), and `1.64.0` stops
# `BatchLogRecordProcessor`'s worker thread being killed by non-runtime exceptions — a log pipeline
# that stops exporting with the pod still Ready, which is this estate's "never silently degrade".
otel = "1.65.0"
# ⛔ `otel-agent` WAS HERE AND IS GONE, 2026-08-24 (W3-O11Y act 2, decision `D-79`) — deleted because
# IT RESOLVED TO NOTHING, which is a different reason from `jackson2`'s and `janino`'s below and is
# worth keeping separate. Measured four ways with a firing control on each: 0 build files and 0
# repositories declared `libs.otel.agent` (controls: `libs.otel.sdk` 23 files / 22 repos,
# `libs.otel.logback.appender` 21 / 21); 0 `-javaagent` hits in either GitOps repository (control:
# 121 files contain `image:`); 0 of 304 running containers declared one (control: 11 declare an
# `OTEL_*` env var); and 0 anywhere for the non-agent JDBC route either.
# ⚠️ `CLAUDE.md` §1's "never delete working plumbing" governs a feature that EXISTS and is DISABLED.
# There was no plumbing here — no jar, no `JAVA_TOOL_OPTIONS`, no wired path, no flag — so this ref
# was an assumption that got written down, not a capability somebody switched off.
# ⛔ The CAPABILITY it stood in for — DB query spans — is kept, and is filed as F323 #490 with its
# MECHANISM named in the first DoD clause: `io.opentelemetry.instrumentation:opentelemetry-jdbc`,
# on the `otel-instrumentation` train below, wrapped around the DataSource that
# `commons-rt-db-foss-postgres`'s `migrateDatabase()` already creates for every service.
# ⛔ Do not restore this ref to "get JDBC spans back". The agent route is 22 images and 22
# Deployments against one wrap in one shared module; it makes what is emitted a function of the
# agent's version rather than of our code; ADR-034 already rejected that shape (a second implicit
# plane beside an explicit one) for workload identity; and the agent's single live advisory is
# `CVE-2026-54704`, "JDBC Auto-Instrumentation Logging Clear-Text Passwords" — this estate's most
# repeated defect offered back as a feature.
# ⚠️ For the record, because the number was quoted forward wrongly in three documents: that advisory
# is first patched at `2.28.0-alpha`, NOT at `2.31.1`. `2.31.1` was the CURRENCY TARGET read as
# though it were the fix. The advisory names ONLY `io.opentelemetry.javaagent:opentelemetry-javaagent`;
# `opentelemetry-logback-appender-1.0` has zero advisories, so it never reached the train below.
# `D-86`, 2026-08-25: `2.27.0-alpha` -> `2.31.1-alpha`, six releases read.
# ⛔ THIS REF AND `otel` ABOVE ARE ONE DECISION, and the vendor writes the binding down rather than
# leaving it to be inferred (hazard 15): every release states the SDK it targets, and `2.31.1`
# targets `1.65.0` exactly. Moving one without the other is the mistake this line exists to prevent.
# ⚠️ We consume exactly ONE artifact from this train — `opentelemetry-logback-appender-1.0` — so the
# interval's large breaking surface is javaagent and library instrumentations we do not have.
# `2.28.0` REMOVED the appender's `captureEventName` builder setting: 0 hits in our tree.
# ⛔ What DOES reach us is a DEPRECATION, not a removal: `2.31.0` deprecates the boolean capture
# settings in favour of `.included`/`.excluded` selectors, and `servista-service-runtime`'s
# `logback-base.xml` sets `captureExperimentalAttributes` and `captureKeyValuePairAttributes`.
# `2.31.1` still honours them; migrating is an `I5` item, not a blocker.
otel-instrumentation = "2.31.1-alpha"
# `D-86`, 2026-08-25: `1.0.4` -> `2.1.2`, eleven releases read, crossing a major.
# ⛔⛔ THE MAJOR IS AN ARTIFACT SPLIT AND IT IS WHY `pyroscope-agent` BELOW EXISTS. `2.0.0` made
# `io.pyroscope:otel` the THIN library jar — measured, not read: 5,440,660 B / 2,074 entries at
# `1.0.4` against 4,916 B / 9 entries at `2.1.2` — and moved everything it used to shade into
# `io.pyroscope:agent`, which its POM now declares at `runtime` scope where `1.0.4` declared no
# dependencies at all.
# ⛔ A RUNTIME-SCOPED TRANSITIVE DEPENDENCY IS NOT ON THE COMPILE CLASSPATH, and
# `ProfilingSetup.kt` compiles against `Config` and `PyroscopeAgent`. That is the whole reason the
# ref below is separate rather than implied.
# ⛔ AND `2.1.0` ADDS A CLIENT -> SERVER ORDERING CONSTRAINT, which is a PHASE II obligation this
# comment carries because nothing else will: `trace_id` is emitted UNCONDITIONALLY and needs a
# Pyroscope SERVER with grafana/pyroscope#5220, first shipped in server `v2.1.0`. Ours runs `2.0.6`
# (D-83). On an older server `trace_id` is promoted to a PER-TRACE SERIES LABEL and inflates the
# index. ⛔ THE SERVER REACHES `>= 2.1.0` BEFORE THE FLEET REBUILD, NOT AFTER.
# ⚠️ Harmless today only because profiling is off fleet-wide and the store holds zero profiles —
# a fact about a config, not about the code. One `PYROSCOPE_SERVER_ADDRESS` changes it.
# ⚠️ And a correction to a sentence three documents quoted forward: the client was NEVER "a major
# behind the 2.x server". `grafana/otel-profiling-java` and `grafana/pyroscope` are different
# projects with independent version lines and the matching numbers are a coincidence.
pyroscope = "2.1.2"
# ⛔ NEW REF, 2026-08-25 (`D-86`). It is not a new dependency: it is the un-shaded half of what
# `io.pyroscope:otel:1.0.4` already carried inside itself, now declared where the build can see it.
# ⚠️ `2.9.1` is the latest stable and NOT the `2.6.0` the bridge's own POM names. The estate's
# standing rule is to pin the latest stable, and it is satisfiable here without a compatibility
# argument: every class `ProfilingSetup.kt` touches — `PyroscopeAgent`, `api.ConfigurationProvider`,
# `config.Config`, `impl.DefaultConfigurationProvider` — plus `Config.build(ConfigurationProvider)`
# and the four public fields it reads were verified present in the `2.9.1` jar, with a firing
# control on a fabricated class name.
# ⛔ IT IS A 5.7 MB SHADED FAT JAR CARRYING SIX `META-INF/*.kotlin_module` ENTRIES, so it inherits
# the shadowJar handling that used to be written against `io.pyroscope:otel`. A build file that
# still excludes the OLD coordinate excludes 4.9 KB and lets 5.7 MB through unhandled.
pyroscope-agent = "2.9.1"
micrometer = "1.17.1"
# ⛔ mockk is the estate's ONE mocking library. `mockito` and `mockito-kotlin`
# were retired by W2d (F269 #426, decision D-10, 2026-08-19) — RETIRED, not
# bumped: mockito-kotlin is a syntax wrapper over a Java-semantics engine, and
# its inability to match an inline `value class` in argument position is
# structural (it matches on the JVM signature, where value classes are unboxed
# and mangled) rather than a bug that 6.2.0 happened to fix. Do not re-add them.
mockk = "1.14.11"
testcontainers = "2.0.5"
# ⛔ ONE ref for BOTH junit coordinates, and it is only possible because JUnit 6
# renumbered the Platform from `1.x` to `6.x` to line up with Jupiter — so
# `junit5 5.14.2 -> 6.1.3` and `junit-platform-launcher 1.14.2 -> 6.1.3` are the
# SAME release, not two jumps. Until W2e (F269 #426, decision D-11, 2026-08-20)
# these were two independent version refs that had to be moved together by hand;
# raising one and forgetting the other is how an engine ends up beside a
# mismatched API, which reports BUILD SUCCESSFUL over zero executed tests.
# ⛔ THE LIBRARY ALIAS WAS `junit5` AND IS NOW `junit`, on the platform owner's
# instruction of 2026-08-20: the `5` was the major, so the alias contradicted the
# version it pointed at the moment this ref moved. ⚠️ `libs.junit` and
# `libs.junit.platform.launcher` are legal siblings — Gradle generates an
# accessor that is both a dependency and a namespace — but that was PROVEN on a
# scratch build resolving both before the 56 call sites were touched, not assumed.
# ⚠️ `org.junit:junit-bom` is NOT declared here on purpose: `junit-jupiter`
# already depends on it, so it is in every resolved graph and aligns the
# coordinates nobody declares. Declaring `platform(...)` in 56 build files was
# measured and DECLINED — its only gain over this ref would be governing a third
# party that declares junit HIGHER than we do, and the only one that declares it
# at all (`kotlin-test-junit5`, at 5.10.1) declares it lower.
junit = "6.1.3"
kotest = "6.2.4"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
# ⛔ PIN THE BARE `0.8.0`, NEVER `0.8.0-0.6.x-compat` — and note that `maven-metadata.xml`'s
# `<latest>` AND `<release>` BOTH name the compat variant, because it was published last. The
# compat artifact still carries the removed `kotlinx.datetime.Instant`/`Clock` for third parties
# that have not migrated; Servista imports neither, and upstream stops publishing compat releases
# after the 0.8.x line. `check-dependency-currency.mjs` excludes it by rule, not by memory.
# ⚠️ 0.8.0 "removes Instant and Clock" and removes ZERO CLASSES — they were typealiases, which live
# in Kotlin metadata rather than bytecode. Measured by diffing the two jars: −0 classes, +2
# (`LocalIsoWeekDate`), POM dependency identical at both versions.
# ⛔ ONLY declare this where something IMPORTS it. W1-KD found it declared in 8 build files and
# imported by NONE, which is how the estate ended up shipping it in 8 fat jars for nothing.
kotlinx-datetime = "0.8.0"
# ⛔ 8.x REMOVED 61 PUBLIC METHODS FROM `KLogger` AND THE ESTATE USES NONE OF THEM — measured, not
# assumed: an init script forced 8.0.4 into every configuration and 23 of 23 repositories compiled
# main+test and 11 of 11 integration source sets compiled, with ZERO source changes. 50 of the
# removals are the SLF4J-style String API (`logger.info("fmt {}", a)`), which fails at COMPILE time;
# the other 11 were merged into a `Marker` overload with a Kotlin default, which is source-compatible
# and BINARY-incompatible — a jar compiled against 7.0.3 calling `isDebugEnabled()` throws
# NoSuchMethodError and no compile reports it. The estate has 0 call sites of either.
# ⛔ AND 8.0 ADDED A RAW `println` TO STDOUT ON EVERY JVM, defaulting on and mentioned in none of the
# 17 release notes in the interval. 19 of 22 services keep stdout as pure JSON, so it is suppressed
# with `-Dkotlin-logging.logStartupMessage=false` in every entrypoint. ⚠️ It CANNOT be suppressed
# from Kotlin code — the estate's file-scope `KotlinLogging.logger {}` idiom initialises before
# `main` — and `8.0.03` is the release that added the external switch, so the target is load-bearing.
# W2c (F269 #426): governance/servista-planning/work/upgrades/components/W2c-kotlin-logging.md
kotlin-logging = "8.0.4"
logback = "1.6.3"
logstash-logback-encoder = "9.0"
# ⛔ THE ENCODER'S JACKSON, AND IT IS A FORCE RATHER THAN A CHOICE. logstash-logback-encoder 9.0 is a
# Jackson 3 migration (`com.fasterxml.jackson.core` -> `tools.jackson.core`, a groupId change) and it
# asks for 3.0.1, which carries 8 advisories; 3.2.2 carries 0. Measured against OSV: with this BOM
# applied the WHOLE resolved logging closure — logback-classic, logback-core, the encoder,
# jackson-databind, jackson-core and the legacy-groupId jackson-annotations it still drags — is
# advisory-clean. ⚠️ A version catalog cannot force anything on its own; the force is
# `implementation(platform(libs.jackson.bom))` in servista-service-runtime, where the encoder is
# declared. Same shape as A274 #431 D2's netty-bom.
jackson = "3.2.2"
# ⛔ `jackson2` WAS HERE AND IS GONE, 2026-08-21 (W3-OF, F269 #426) — deleted because UPSTREAM FIXED
# THE DEFECT IT EXISTED FOR, which is the only reason a workaround ref may be removed rather than
# bumped. It pinned `com.fasterxml.jackson.core:jackson-databind` at 2.22.2 for exactly one reason:
# `dev.openfga:openfga-sdk` returns a `com.fasterxml.jackson.databind.ObjectMapper` from
# `ApiClient.objectMapper` — a PUBLIC API method — while its POM declared jackson-databind at
# `<scope>runtime</scope>`, so eight repositories' OpenFGA test bootstrap could not compile unless
# something else put that jar on their compile classpath. (Until 2026-08-19 that something else was
# `logstash-logback-encoder 8.1`, by ACCIDENT; encoder 9.0 moved to the `tools.jackson` groupId and
# all eight broke at once. W2b, F269 #426.)
# ✅ `openfga-sdk 0.9.11` promotes jackson-core, jackson-annotations, jackson-databind, jsr305 and
# opentelemetry-api from `runtime` to `compile`, so every consumer that declares the SDK now gets
# the mapper on its own compile classpath from the SDK itself. MEASURED by diffing the 0.9.7 and
# 0.9.11 POMs, and PROVEN by the gates of the ten repositories that use the idiom.
# ✅ It also closes the security half without a ref: 0.9.7 imported jackson-bom 2.21.1 (10 OSV
# advisories) and 0.9.11 imports 2.22.1 (0), so the RUNTIME copy A277 #434 filed — the one this
# comment used to say was "NOT fixed here" — is fixed by the bump rather than by a force.
# ⛔ Do not restore this ref to "pin Jackson 2". It never pinned Jackson 2 for the estate; it put one
# jar on one compile classpath, and the estate's own Jackson is `jackson` (3.x) above.
# ⛔ `janino` WAS HERE AND IS GONE, 2026-08-19. It existed for exactly one reason: to evaluate the
# `<if condition='…'>` attribute in servista-database's logback.xml. logback 1.5.37 REMOVED Janino
# conditional evaluation under CVE-2026-13006 and three siblings, and that config now uses the
# `<condition>` element, which needs no expression compiler. Measured absent-clean on 1.5.32 AND
# 1.6.3, with and without the jar. It is the only ref this catalog has ever held whose sole reason
# to exist was a feature upstream deleted — do not restore it without a new one.
slf4j = "2.0.18"
detekt = "2.0.0-alpha.6"
dokka = "2.2.0"
ktfmt = "0.27.0"
shadow = "9.6.1"
konform = "0.11.1"
tink = "1.23.0"
# ⛔ TWO refs on purpose — bcpkix is NOT behind.
# BC patches per module: 1.85.2 was published for bcprov ONLY
# (upstream: "only the bcprov jars are being published for this
# release"). bcprov is the only LEAF of the three — bcpkix->bcutil
# ->bcprov — which is why it can be patched, and pinned, alone.
# ⚠️ bcutil is deliberately NOT pinned: bcpkix names it exactly,
# so it cannot diverge. check-dependency-currency.mjs fails if
# these two refs drift by more than a patch.
bouncycastle      = "1.85.2"   # bcprov-jdk18on (ships in images)
bouncycastle-pkix = "1.85"     # bcpkix-jdk18on (test-only here)
aws-sdk = "2.54.9"

# ⛔ FIVE COORDINATES ADOPTED 2026-08-23 (`F285 #442` D3) — AND EVERY ONE IS ADOPTED AT THE VERSION
# ALREADY IN USE, NOT AT LATEST. That is deliberate and it is the whole point of the clause.
#
# They were pinned inline in `api-organizations` and `servista-edge-auth-lambda`, governed by
# nothing, and therefore **reported by nothing** — `check-dependency-currency.mjs` read this file
# and this file did not mention them, so their drift produced no row at all. ⚠️ *A wrong target is
# visible; a missing row is not.* D3 exists to make "ungoverned" stop being a silence.
#
# ⛔ ADOPTING AT LATEST WOULD HAVE SMUGGLED FIVE VERSION DECISIONS PAST `I2`/`I3` — *one component
# at a time*, *read every release note in the interval* — inside a row whose subject is governance
# and not currency. Adopted where they stand, the resolved classpath does not move by a single jar,
# and the gap becomes an ORDINARY currency finding owned by `F269 #426` and the upgrade programme.
# Measured against Maven Central the same day (`<release>`, with a passing 404 control):
#
#   nv-i18n          1.29    = latest — current
#   libphonenumber   9.0.36  → 9.0.37   (one patch)
#   aws-lambda-core  1.3.0   → 1.4.0    (one minor)
#   aws-lambda-events 3.14.0 → 3.16.1   (two minors)   ⚠️ THREE releases, not two — 3.16.1 is a patch
#   typesafe-config  1.4.3   → 1.4.9    (six patches)
#
# ⚠️ So this edit makes the check REPORT FOUR NEW FINDINGS, and that is the deliverable rather than
# a regression. Do not "fix" them by reverting the adoption.
#
# ✅ ALL FOUR CLOSED 2026-08-25 by upgrade unit `W1-CJ` (`D-88`/`D-89`), which took them to the
# targets listed above together with `aws-sdk 2.54.2 → 2.54.3`. Twelve release notes read, every
# claim measured against the artifact rather than the note:
#   · libphonenumber   0 class files differ; 22 of 544 metadata blobs do. The estate's ONE call is
#                      getCountryCodeForRegion, and all 245 regions answer identically on both.
#                      ⛔ 9.0.37 IS NO LONGER THE PIN — see the 9.0.38 block below, which re-took
#                      this measurement rather than inheriting it.
#   · aws-lambda-core  one added `default` method (Context.getXrayTraceId) — nothing else.
#   · aws-lambda-events 4 classes added, 12 changed, in four event families the Lambda does not
#                      import. ⛔ 3.16.1 has NO release note, NO tag and NO changelog entry
#                      upstream; its content was derived from the jar (a nested ConnectEvent.Queue).
#   · typesafe-config  ⛔ NOT a bump: `ktor-server-core 3.5.2` already drags 1.4.9 onto every Ktor
#                      service, so this ref was BEHIND the resolved graph and the only artifact
#                      actually on 1.4.3 was `servista-edge-auth-lambda`, which has no Ktor to
#                      out-vote the catalog. The bump removes a skew. See W1-CJ §3.6.
#   · aws-sdk          0 class bytes move in `s3` (0 of 2,348) or `apache5-client`; only the
#                      embedded pom files. Control: 2.50.0 → 2.54.3 moves 23.
# ⛔ Read `dependencyInsight --configuration runtimeClasspath` before pricing a catalog bump: a
# catalog ref moves the version only where the catalog is the WINNING declaration.
# ⭐ libphonenumber 9.0.37 → 9.0.38 — bumped 2026-08-26 on the platform owner's instruction,
# during W3-OF/D-108. ⛔ IT APPEARED UPSTREAM MID-SITTING: Maven Central's lastUpdated is
# 20260826121311, about two hours after a check-docs run that read only two currency findings.
#
# ⛔ I3 SAYS READ EVERY RELEASE NOTE IN THE INTERVAL, AND THERE IS NONE. Google has published no
# GitHub release, tag or changelog entry for v9.0.38 — the jar is on Maven Central and nothing
# else exists. That is the aws-lambda-events 3.16.1 shape from W1-CJ, and the answer is the same:
# DERIVE IT FROM THE ARTIFACT.
#
# Measured against the two jars, with a control that fires:
#   · 0 of 67 class files differ (same class set). ⭐ Control: 9.0.30 → 9.0.38 moves 3, so the
#     comparison can see a class change.
#   · 11 of 544 metadata blobs differ — 3 build stamps (MANIFEST.MF, pom.properties, pom.xml) and
#     EIGHT country metadata blobs: GM, HK, IN, JO, PG, SN, TZ, ZW.
#   · What moved inside them, by pattern-string diff: national NUMBER-RANGE regexes (IN 31, ZW 19,
#     HK 6, JO 5, PG 4, SN 4, GM 2, TZ 2) plus two formatting rules (JO, ZW).
#     ⭐ Control: BE, a region whose blob did not change, shows 0 — so the diff discriminates.
#   · ⛔ NOT ONE OF THEM IS A COUNTRY CALLING CODE, which is the estate's only call.
#     getCountryCodeForRegion is identical on all 245 supported regions AND on all 676 possible
#     ISO alpha-2 strings — a superset of the officially-assigned set the catalog actually passes.
# ⚠️ AND THE HONEST LIMIT: a behavioural probe could NOT be made to tell these two jars apart —
# not on getCountryCodeForRegion, not on getExampleNumber/isValidNumber, not on
# getExampleNumberForType across every PhoneNumberType for the eight changed regions. The
# load-bearing evidence is the class-file measurement and the located pattern diff, NOT a green
# behavioural comparison whose control never fired.
#
# Consumer: ONE — api-organizations, LibraryCountryCatalog.kt, `getCountryCodeForRegion(alpha2)`.
